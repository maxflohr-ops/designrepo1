name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bounty_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bounty_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  ios-build:
    # Compiles the SwiftUI app on a macOS runner — the container this repo is
    # developed in has no Swift toolchain, so this job is the build gate.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.2.app || ls /Applications | grep Xcode
      - name: Build (simulator, no signing)
        run: |
          # set -o pipefail is load-bearing. Without it the pipeline's exit
          # status is tee's, not xcodebuild's, and a failing compile reports
          # this job as green. That is exactly what happened on runs #1-#13:
          # AppState.swift:300 failed to compile every time and the gate said
          # "succeeded". Do not remove this line, and do not end this pipeline
          # in a command that always exits 0.
          set -o pipefail
          xcodebuild build \
            -project ios/BountySounds.xcodeproj \
            -scheme BountySounds \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild.log

      # Runs even when the build fails, so the diagnostics are readable
      # without scrolling a 4000-line log.
      - name: Compiler diagnostics
        if: always()
        run: |
          echo "--- errors ---"
          grep -E "^/.*: error:" /tmp/xcodebuild.log | sort -u || echo "(none)"
          echo "--- warnings ---"
          grep -E "^/.*: warning:" /tmp/xcodebuild.log | sort -u | head -40 || echo "(none)"
